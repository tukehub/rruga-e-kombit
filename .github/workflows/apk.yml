name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build the game into www/
        run: python3 build.py

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -Pvc=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk rruga-e-kombit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rruga-e-kombit-apk
          path: rruga-e-kombit.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" rruga-e-kombit.apk \
            --title "Kafshim asfalti $tag" \
            --notes "Hape këtë faqe në telefon, shkarko rruga-e-kombit.apk dhe instaloje." \
            --latest
